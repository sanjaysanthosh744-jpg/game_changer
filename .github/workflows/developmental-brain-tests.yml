name: Developmental Brain Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developmental_brain_prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q brain tests main.py inspect_brain.py run_change_point_sweep.py run_repeated_change_sweep.py run_detector_comparison.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compare change-point detectors
        run: python run_detector_comparison.py
